name: Android ARM64 APK

on:
  push:
    branches: [main]
    paths:
      - Mamadysh_Most_Wanted_116_v4_4.zip
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GODOT_VERSION: 4.6.3
      ANDROID_TOOLS: 36.1.0
      ARCHIVE: Mamadysh_Most_Wanted_116_v4_4.zip
      APP_ID: ru.tatarstan.mamadysh.mostwanted.compat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.1.0'

      - name: Check project and prepare Godot
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/project"
          mkdir -p "$project"
          unzip -q "$ARCHIVE" -d "$project"
          project="$project/mamadysh-godot"
          test -f "$project/project.godot"
          test -f "$project/assets/map/mamadysh_map.json"
          test -f "$project/tools/verify_android_apk.py"
          echo "GODOT_PROJECT=$project" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.config/godot"
          cd "$RUNNER_TEMP/godot"
          release="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL --retry 3 "$release/$editor.zip" -o editor.zip
          unzip -q editor.zip
          chmod +x "$editor"
          echo "GODOT_BIN=$PWD/$editor" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 "$release/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$templates"
          unzip -jq templates.tpz templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$templates"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Import and export APK
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_COMPAT_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_COMPAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_COMPAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keyfile="$RUNNER_TEMP/android-compat.jks"
          app_id="$APP_ID"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$keyfile"
          if [[ -z "$KEYSTORE_B64$KEY_ALIAS$KEY_PASSWORD" ]]; then
            app_id="$APP_ID.ci"
            unset KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="android-ci"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$(openssl rand -hex 24)"
            keytool -genkeypair -storetype PKCS12 -keystore "$keyfile" \
              -storepass:env GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD -alias android-ci \
              -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=Mamadysh CI' -noprompt
            python3 - "$GODOT_PROJECT/export_presets.cfg" "$app_id" <<'PY'
          from pathlib import Path
          import re
          import sys

          preset = Path(sys.argv[1])
          content = preset.read_text()
          content = re.sub(r'^package/unique_name=.*$', f'package/unique_name="{sys.argv[2]}"', content, flags=re.M)
          content = re.sub(r'^package/name=.*$', 'package/name="Мамадыш CI"', content, flags=re.M)
          preset.write_text(content)
          PY
          else
            : "${KEYSTORE_B64:?}" "${KEY_ALIAS:?}" "${KEY_PASSWORD:?}"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS"
            export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEY_PASSWORD"
            unset KEYSTORE_B64 KEY_ALIAS KEY_PASSWORD
          fi
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT" --editor --import
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT" --script res://tests/Regression44.gd
          mkdir -p "$GITHUB_WORKSPACE/build"
          apk="$GITHUB_WORKSPACE/build/Mamadysh_Most_Wanted_v4_4_Compat_ARM64.apk"
          "$GODOT_BIN" --headless --path "$GODOT_PROJECT" --export-release Android "$apk"
          python3 "$GODOT_PROJECT/tools/verify_android_apk.py" "$apk" "$ANDROID_HOME/build-tools/$ANDROID_TOOLS" "$app_id" 44

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Mamadysh-v4.4-Android-ARM64
          path: build/Mamadysh_Most_Wanted_v4_4_Compat_ARM64.apk
          if-no-files-found: error
          retention-days: 14
